<main>
  <h1>Hash Calculator</h1>
  <p class="muted">Compute SHA-256, BLAKE3 and MD5 locally. Files are read in-browser; nothing is uploaded.</p>
  <div class="card">
    <label>Text input</label>
    <textarea id="txt" placeholder="type or paste text…"></textarea>
    <label>Or choose a file</label>
    <input id="file" type="file"/>
    <div class="row" style="margin-top:10px">
      <button class="btn primary" id="go">Hash it</button>
      <span class="muted" id="busy"></span>
    </div>
    <div style="margin-top:12px" class="copy">
      <div class="output" id="out">—</div>
      <button class="btn copybtn" onclick="copyOut()">copy</button>
    </div>
    <div class="note">MD5 is provided for <b>integrity verification only</b> — it is broken for collision resistance. Use SHA-256 or BLAKE3 for trust.</div>
  </div>
</main>
<footer>0xPrivacy · <a class="link" href="../../index.html">all tools</a></footer>
<script type="module">
import { sha256 } from '@noble/hashes/sha256';
import { blake3 } from '@noble/hashes/blake3';

const enc = new TextEncoder();
const $ = id => document.getElementById(id);
window.copyOut = () => navigator.clipboard?.writeText($('out').textContent);

function hex(b){ return Array.from(b).map(x=>x.toString(16).padStart(2,'0')).join(''); }

// --- MD5 (RFC 1321), vendored, offline, checksum-only ---
function md5hex(u8in){
  function safeAdd(x,y){ const l=(x&0xffff)+(y&0xffff), m=(x>>16)+(y>>16)+(l>>16); return (m<<16)|(l&0xffff); }
  function rol(n,c){ return (n<<c)|(n>>>(32-c)); }
  function cmn(q,a,b,x,s,t){ a=safeAdd(rol(safeAdd(safeAdd(a,q),safeAdd(x,t)),s),b); return a; }
  function ff(a,b,c,d,x,s,t){ return cmn((b&c)|((~b)&d),a,b,x,s,t); }
  function gg(a,b,c,d,x,s,t){ return cmn((b&d)|(c&(~d)),a,b,x,s,t); }
  function hh(a,b,c,d,x,s,t){ return cmn(b^c^d,a,b,x,s,t); }
  function ii(a,b,c,d,x,s,t){ return cmn(c^(b|(~d)),a,b,x,s,t); }
  // build 16-word blocks from the byte string
  function md5blk(bstr){
    const b=[];
    for(let i=0,j=0;i<64;i+=4,j++) b[j]=bstr.charCodeAt(i)|(bstr.charCodeAt(i+1)<<8)|(bstr.charCodeAt(i+2)<<16)|(bstr.charCodeAt(i+3)<<24);
    return b;
  }
  // convert Uint8Array -> latin1 string
  let str=''; for(let i=0;i<u8in.length;i++) str+=String.fromCharCode(u8in[i]);
  const nblk=((str.length+8)>>6)+1;
  const blks=new Array(nblk*16).fill(0);
  for(let i=0;i<str.length;i++) blks[i>>2]|=(str.charCodeAt(i))<<((i%4)*8);
  blks[str.length>>2]|=0x80<<((str.length%4)*8);
  blks[nblk*16-2]=str.length*8;
  let a=1732584193,b=-271733879,c=-1732584194,d=271733878;
  for(let i=0;i<blks.length;i+=16){
    const x=md5blk(arrayToStr(blks,i));
    const oa=a,ob=b,oc=c,od=d;
    a=ff(a,b,c,d,x[0],7,-680876936); d=ff(d,a,b,c,x[1],12,-389564586); c=ff(c,d,a,b,x[2],17,606105819); b=ff(b,c,d,a,x[3],22,-1044525330);
    a=ff(a,b,c,d,x[4],7,-176418897); d=ff(d,a,b,c,x[5],12,1200080426); c=ff(c,d,a,b,x[6],17,-1473231341); b=ff(b,c,d,a,x[7],22,-45705983);
    a=ff(a,b,c,d,x[8],7,1770035416); d=ff(d,a,b,c,x[9],12,-1958414417); c=ff(c,d,a,b,x[10],17,-42063); b=ff(b,c,d,a,x[11],22,-1990404162);
    a=ff(a,b,c,d,x[12],7,1804603682); d=ff(d,a,b,c,x[13],12,-40341101); c=ff(c,d,a,b,x[14],17,-1502002290); b=ff(b,c,d,a,x[15],22,1236535329);
    a=gg(a,b,c,d,x[1],5,-165796510); d=gg(d,a,b,c,x[6],9,-1069501632); c=gg(c,d,a,b,x[11],14,643717713); b=gg(b,c,d,a,x[0],20,-373897302);
    a=gg(a,b,c,d,x[5],5,-701558691); d=gg(d,a,b,c,x[10],9,38016083); c=gg(c,d,a,b,x[15],14,-660478335); b=gg(b,c,d,a,x[4],20,-405537848);
    a=gg(a,b,c,d,x[9],5,568446438); d=gg(d,a,b,c,x[14],9,-1019803690); c=gg(c,d,a,b,x[3],14,-187363961); b=gg(b,c,d,a,x[8],20,1163531501);
    a=gg(a,b,c,d,x[13],5,-1444681467); d=gg(d,a,b,c,x[2],9,-51403784); c=gg(c,d,a,b,x[7],14,1735328473); b=gg(b,c,d,a,x[12],20,-1926607734);
    a=hh(a,b,c,d,x[5],4,-378558); d=hh(d,a,b,c,x[8],11,-2022574463); c=hh(c,d,a,b,x[11],16,1839030562); b=hh(b,c,d,a,x[14],23,-35309556);
    a=hh(a,b,c,d,x[1],4,-1530992060); d=hh(d,a,b,c,x[4],11,1272893353); c=hh(c,d,a,b,x[7],16,-155497632); b=hh(b,c,d,a,x[10],23,-1094730640);
    a=hh(a,b,c,d,x[13],4,681279174); d=hh(d,a,b,c,x[0],11,-358537222); c=hh(c,d,a,b,x[3],16,-722521979); b=hh(b,c,d,a,x[6],23,76029189);
    a=hh(a,b,c,d,x[9],4,-640364487); d=hh(d,a,b,c,x[12],11,-421815835); c=hh(c,d,a,b,x[15],16,530742520); b=hh(b,c,d,a,x[2],23,-995338651);
    a=ii(a,b,c,d,x[0],6,-198630844); d=ii(d,a,b,c,x[7],10,1126891415); c=ii(c,d,a,b,x[14],15,-1416354905); b=ii(b,c,d,a,x[5],21,-57434055);
    a=ii(a,b,c,d,x[12],6,1700485571); d=ii(d,a,b,c,x[3],10,-1894986606); c=ii(c,d,a,b,x[10],15,-1051523); b=ii(b,c,d,a,x[1],21,-2054922799);
    a=ii(a,b,c,d,x[8],6,1873313359); d=ii(d,a,b,c,x[15],10,-30611744); c=ii(c,d,a,b,x[6],15,-1560198380); b=ii(b,c,d,a,x[13],21,1309151649);
    a=ii(a,b,c,d,x[4],6,-145523070); d=ii(d,a,b,c,x[11],10,-1120210379); c=ii(c,d,a,b,x[2],15,718787259); b=ii(b,c,d,a,x[9],21,-343485551);
    a=safeAdd(a,oa); b=safeAdd(b,ob); c=safeAdd(c,oc); d=safeAdd(d,od);
  }
  function b2h(x){ return [x&0xff,(x>>8)&0xff,(x>>16)&0xff,(x>>24)&0xff].map(v=>v.toString(16).padStart(2,'0')).join(''); }
  return b2h(a)+b2h(b)+b2h(c)+b2h(d);
  function arrayToStr(arr,off){ let o=''; for(let i=0;i<16;i++){ const w=arr[off+i]|0; o+=String.fromCharCode(w&0xff)+String.fromCharCode((w>>8)&0xff)+String.fromCharCode((w>>16)&0xff)+String.fromCharCode((w>>>24)&0xff);} return o; }
}

async function fileBytes(f){ return new Uint8Array(await f.arrayBuffer()); }

$('go').addEventListener('click', async ()=>{
  let data;
  if($('file').files.length){
    $('busy').textContent = 'reading file…';
    data = await fileBytes($('file').files[0]);
  } else {
    data = enc.encode($('txt').value);
  }
  $('busy').textContent = 'hashing…';
  await new Promise(r=>setTimeout(r,10));
  const res = [
    ['SHA-256', hex(sha256(data))],
    ['BLAKE3',  hex(blake3(data))],
    ['MD5',     md5hex(data)]
  ].map(([k,v])=>`${k}: ${v}`).join('\n');
  $('out').textContent = res;
  $('busy').textContent = `input bytes: ${data.length}`;
});
</script>
</body>
