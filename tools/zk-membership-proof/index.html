<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ZK-Membership-Proof: Private Group Access</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font-family:monospace;background:#0d1117;color:#c9d1d9;margin:0;padding:1rem}input,button{background:#161b22;color:#c9d1d9;border:1px solid #30363d;padding:.5rem;margin:.25rem;width:90%}pre{white-space:pre-wrap}</style>
</head>
<body>
<h1>ZK-Membership-Proof</h1>
<p>Prove you belong to a private group/relay whitelist without revealing which member you are.</p>
<input id="pubkey" type="text" placeholder="your npub1... or hex x-only" size="40">
<input id="group" type="text" placeholder="group id, e.g. relay:wss://0xflare" value="">
<button onclick="proveMember()">Generate membership proof</button>
<pre id="out"></pre>

<script type="module">
// Demo: real version holds a Merkle root of approved pubkeys server-side
// (or in a public Nostr event). Prover shows a ZK proof of Merkle membership
// for their key against the root, without revealing the leaf/index.
window.proveMember = async () => {
  const pk = document.getElementById('pubkey').value.trim();
  const group = document.getElementById('group').value.trim();
  const out = document.getElementById('out');
  if(!pk || !group){ out.textContent = 'Enter pubkey and group id.'; return; }
  const enc = new TextEncoder();
  const buf = await crypto.subtle.digest('SHA-256', enc.encode(pk + '|' + group));
  const nullifier = [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,32);
  const receipt = { group, nullifier, ts: Date.now() };
  out.textContent = 'ZK membership proof (simulation):\ngroup=' + group +
    '\nnullifier=' + nullifier + '\n' + btoa(JSON.stringify(receipt)).slice(0,80) + '...';
};
</script>
</body>
</html>
