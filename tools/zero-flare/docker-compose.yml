version: "3.9"

services:
  tor:
    image: alpine:latest
    cap_add:
      - NET_ADMIN
    ports:
      - "9150:9150"
      - "9040:9040"
    volumes:
      - tor-data:/data
    command: ["sh","-c","apk add --no-cache tor tor-geoip && tor -f /etc/tor/torrc"]
    healthcheck:
      test: ["CMD","nc","-z","localhost","9150"]
      interval: 30s
      timeout: 5s

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      tor:
        condition: service_healthy
    environment:
      - NGINX_HOST=localhost

  snowflake:
    image: alpine:latest
    restart: unless-stopped
    command: ["sh","-c","apk add --no-cache curl && tail -f /dev/null"]
    ports:
      - "8081:8080"

volumes:
  tor-data:
